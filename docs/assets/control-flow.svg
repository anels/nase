<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1080 740" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="control-flow-title control-flow-desc">
      <title id="control-flow-title">How a tool call is gated</title>
      <desc id="control-flow-desc">Control-flow diagram: the prompt contract shapes a Claude Code tool call, five blocking PreToolUse hooks either deny the call or route it down one of two approved write paths, a staged workspace write or a payload-bound external manifest, while PostToolUse hooks append telemetry to the workspace stats log.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== connectors (drawn before nodes) ===== -->
      <g fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)">
        <line x1="280" y1="92" x2="440" y2="92"/>
        <line x1="500" y1="136" x2="500" y2="216"/>
        <path d="M 500,304 V 336 Q 500,344 492,344 H 188 Q 180,344 180,352 V 384"/>
        <path d="M 600,304 V 336 Q 600,344 608,344 H 932 Q 940,344 940,352 V 384"/>
        <line x1="180" y1="472" x2="180" y2="552"/>
        <line x1="900" y1="472" x2="900" y2="552"/>
      </g>

      <!-- denied path -->
      <line x1="580" y1="216" x2="580" y2="136" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <!-- passive telemetry path -->
      <path d="M 640,92 H 892 Q 900,92 900,100 V 216" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- ===== connector labels ===== -->
      <g font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="8" fill="#4f5d75" letter-spacing="0.08em" text-anchor="middle">
        <rect x="324" y="72" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="360" y="80">SKILL RULES</text>

        <rect x="730" y="72" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="766" y="80">POSTTOOLUSE</text>

        <rect x="420" y="170" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="452" y="178">PRETOOLUSE</text>

        <rect x="596" y="170" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="628" y="178">BLOCKED</text>

        <rect x="300" y="324" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="336" y="332">STAGED WRITE</text>

        <rect x="716" y="324" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="760" y="332">EXTERNAL WRITE</text>

        <rect x="188" y="500" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="208" y="508">APPLY</text>

        <rect x="908" y="500" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="936" y="508">MANIFEST</text>
      </g>

      <!-- ===== nodes ===== -->
      <g stroke-width="1">
        <rect x="80"  y="48"  width="200" height="88" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <rect x="440" y="48"  width="200" height="88" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <rect x="440" y="216" width="200" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="440" y="216" width="200" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/>
        <rect x="800" y="216" width="200" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/>
        <rect x="80"  y="384" width="200" height="88" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <rect x="800" y="384" width="200" height="88" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <rect x="80"  y="552" width="200" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/>
        <rect x="800" y="552" width="200" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/>
      </g>

      <!-- ===== type tags ===== -->
      <g font-size="7" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">
        <rect x="88"  y="56"  width="48" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="112" y="64"  fill="rgba(45,49,66,0.80)">PROMPT</text>

        <rect x="448" y="56"  width="48" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="472" y="64"  fill="rgba(45,49,66,0.80)">TOOL</text>

        <rect x="448" y="224" width="48" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
        <text x="472" y="232" fill="#eb6c36">HOOK</text>

        <rect x="808" y="224" width="48" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="832" y="232" fill="rgba(79,93,117,0.90)">STATS</text>

        <rect x="88"  y="392" width="48" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="112" y="400" fill="rgba(45,49,66,0.80)">SCRIPT</text>

        <rect x="808" y="392" width="48" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="832" y="400" fill="rgba(45,49,66,0.80)">SCRIPT</text>

        <rect x="88"  y="560" width="48" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="112" y="568" fill="rgba(79,93,117,0.90)">STATE</text>

        <rect x="808" y="560" width="48" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="832" y="568" fill="rgba(79,93,117,0.90)">REMOTE</text>
      </g>

      <!-- ===== node text ===== -->
      <g text-anchor="middle">
        <g font-family="'Geist', 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#2d3142">
          <text x="180" y="88">Prompt contract</text>
          <text x="540" y="88">Tool call</text>
          <text x="540" y="256" fill="#eb6c36">PreToolUse guards</text>
          <text x="900" y="256">Telemetry</text>
          <text x="180" y="424">Staged write</text>
          <text x="900" y="424">Bound manifest</text>
          <text x="180" y="592">Durable state</text>
          <text x="900" y="592">External services</text>
        </g>
        <g font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#4f5d75">
          <text x="180" y="108">CLAUDE.md · commands/nase/</text>
          <text x="540" y="108">Bash · Edit · MCP write</text>
          <text x="540" y="276">5 blocking hooks</text>
          <text x="900" y="276">workspace/stats/*.jsonl</text>
          <text x="180" y="444">workspace-write-guard.py</text>
          <text x="900" y="444">external-write-action.py</text>
          <text x="180" y="612">workspace/</text>
          <text x="900" y="612">GitHub · Jira · Slack</text>
        </g>
      </g>

      <!-- ===== legend strip ===== -->
      <line x1="40" y1="680" x2="1040" y2="680" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <g font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="8" fill="#4f5d75" letter-spacing="0.08em">
        <text x="40" y="704" letter-spacing="0.14em">LEGEND</text>

        <rect x="120" y="692" width="16" height="16" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="144" y="704">Component</text>

        <rect x="280" y="692" width="16" height="16" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="304" y="704">Blocking gate</text>

        <rect x="440" y="692" width="16" height="16" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="464" y="704">Destination</text>

        <line x1="600" y1="700" x2="620" y2="700" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="632" y="704">Allowed</text>

        <line x1="760" y1="700" x2="780" y2="700" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <text x="792" y="704">Denied</text>

        <line x1="920" y1="700" x2="940" y2="700" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="952" y="704">Passive</text>
      </g>
    </svg>
