<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 648" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="effort-states-title effort-states-desc">
      <title id="effort-states-title">Effort lifecycle states</title>
      <desc id="effort-states-desc">State machine for a nase effort file: an approved design creates a planned effort, /nase:fsd moves it to in-progress, /nase:prep-merge to merge-ready, merged delivery PRs to awaiting-deploy, and a verified deploy to completed, with return paths through needs-revision and blocked.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== transitions (drawn before the states) ===== -->
      <g fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)">
        <line x1="80"   y1="128" x2="160"  y2="128"/>
        <line x1="336"  y1="128" x2="416"  y2="128"/>
        <line x1="592"  y1="128" x2="672"  y2="128"/>
        <line x1="848"  y1="128" x2="928"  y2="128"/>
        <line x1="736"  y1="168" x2="736"  y2="328"/>
        <line x1="480"  y1="168" x2="480"  y2="328"/>
        <line x1="1016" y1="408" x2="1016" y2="468"/>
      </g>

      <!-- return paths -->
      <g fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)">
        <line x1="784" y1="328" x2="784" y2="168"/>
        <line x1="528" y1="328" x2="528" y2="168"/>
      </g>

      <!-- happy path into the focal state -->
      <line x1="1016" y1="168" x2="1016" y2="328" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- ===== transition labels ===== -->
      <g font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="8" fill="#4f5d75" letter-spacing="0.08em" text-anchor="middle">
        <rect x="88"  y="108" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="120" y="116">DESIGN SAVED</text>

        <rect x="344" y="108" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="376" y="116">FSD STARTS</text>

        <rect x="600" y="108" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="632" y="116">PREP-MERGE</text>

        <rect x="856" y="108" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="888" y="116">PRS MERGED</text>

        <rect x="408" y="240" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="440" y="248">BLOCKED-BY</text>

        <rect x="536" y="240" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="564" y="248">UNBLOCKED</text>

        <rect x="664" y="240" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="696" y="248">REVIEW · CI</text>

        <rect x="800" y="240" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="836" y="248">FIXED · PREP</text>

        <rect x="1024" y="240" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1052" y="248">DEPLOY OK</text>

        <rect x="1024" y="436" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1068" y="444">MOVED TO DONE/</text>
      </g>

      <!-- ===== annotation callouts ===== -->
      <g>
        <path d="M 300 336 Q 328 256 252 172" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="248" cy="168" r="2" fill="#2d3142"/>
        <text x="160" y="352" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Iowan Old Style', Georgia, serif">* → wontfix when every</text>
        <text x="160" y="372" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Iowan Old Style', Georgia, serif">delivery PR closes unmerged</text>

        <path d="M 1136 520 Q 1088 508 1024 484" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="1020" cy="484" r="2" fill="#2d3142"/>
        <text x="1240" y="528" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Iowan Old Style', Georgia, serif" text-anchor="end">tracking_only: true files to</text>
        <text x="1240" y="548" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Iowan Old Style', Georgia, serif" text-anchor="end">archive/{YYYY}/ instead of done/</text>
      </g>

      <!-- ===== start marker ===== -->
      <circle cx="72" cy="128" r="6" fill="#2d3142"/>

      <!-- ===== states ===== -->
      <g stroke-width="1">
        <rect x="160" y="88"  width="176" height="80" rx="8" fill="#ffffff" stroke="#2d3142"/>
        <rect x="416" y="88"  width="176" height="80" rx="8" fill="#ffffff" stroke="#2d3142"/>
        <rect x="672" y="88"  width="176" height="80" rx="8" fill="#ffffff" stroke="#2d3142"/>
        <rect x="928" y="88"  width="176" height="80" rx="8" fill="#ffffff" stroke="#2d3142"/>
        <rect x="416" y="328" width="176" height="80" rx="8" fill="#ffffff" stroke="#2d3142"/>
        <rect x="672" y="328" width="176" height="80" rx="8" fill="#ffffff" stroke="#2d3142"/>
        <rect x="928" y="328" width="176" height="80" rx="8" fill="#f5f5f5"/>
        <rect x="928" y="328" width="176" height="80" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/>
      </g>

      <!-- ===== end marker ===== -->
      <circle cx="1016" cy="484" r="8" fill="none" stroke="#2d3142" stroke-width="1.2"/>
      <circle cx="1016" cy="484" r="5" fill="#2d3142"/>

      <!-- ===== state text ===== -->
      <g text-anchor="middle">
        <g font-family="'Geist', 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#2d3142">
          <text x="248"  y="124">Design approved</text>
          <text x="504"  y="124">Implementing</text>
          <text x="760"  y="124">Review passed</text>
          <text x="1016" y="124">Merged, not shipped</text>
          <text x="504"  y="364">Halted</text>
          <text x="760"  y="364">Sent back</text>
          <text x="1016" y="364" fill="#eb6c36">Shipped &amp; verified</text>
        </g>
        <g font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#4f5d75">
          <text x="248"  y="144">planned</text>
          <text x="504"  y="144">in-progress</text>
          <text x="760"  y="144">merge-ready</text>
          <text x="1016" y="144">awaiting-deploy</text>
          <text x="504"  y="384">blocked</text>
          <text x="760"  y="384">needs-revision</text>
          <text x="1016" y="384">completed</text>
        </g>
      </g>

      <!-- ===== legend strip ===== -->
      <line x1="40" y1="584" x2="1240" y2="584" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <g font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="8" fill="#4f5d75" letter-spacing="0.08em">
        <text x="40" y="608" letter-spacing="0.14em">LEGEND</text>

        <rect x="152" y="596" width="16" height="16" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="176" y="608">Effort status</text>

        <rect x="376" y="596" width="16" height="16" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="400" y="608">Shipped &amp; verified</text>

        <circle cx="608" cy="604" r="6" fill="#2d3142"/>
        <text x="624" y="608">Start / end</text>

        <line x1="824" y1="604" x2="844" y2="604" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="856" y="608">Transition</text>

        <line x1="1048" y1="604" x2="1068" y2="604" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="1080" y="608">Return path</text>
      </g>
    </svg>
