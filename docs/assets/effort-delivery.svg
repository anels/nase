<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1288 356" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="effort-delivery-title effort-delivery-desc">
      <title id="effort-delivery-title">Effort delivery flow</title>
      <desc id="effort-delivery-desc">Process diagram of one nase effort from design and grill, through human approval, implementation, review, merge, post-deploy validation and the monthly rollup, showing which actor owns each step and whether the payload handed on is the effort document or the pull request.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="11" cy="11" r="0.8" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-sm" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="#4f5d75"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

