# Subagent role catalog. Skills name a role (for example "lookup"); the dispatcher maps it to a
# model, an effort tier, and a prompt_prefix from this file. Edit here to change routing.
#
# `model`, `effort`, `prompt_prefix`, and `tools` are advisory. A spawn site must pass `model=`
# and `effort=` to `Agent(...)` and put the `prompt_prefix` in the prompt for them to take
# effect. A role name alone carries none of them.

roles:
  lookup:
    model: haiku
    effort: low
    tools: [Read, Grep, Glob, Bash]   # Bash for readonly probes (git log, ls, gh api); no Edit/Write
    description: Fast data gathering, simple lookups, grep/glob scans
    prompt_prefix: "This is a simple lookup - keep reasoning minimal."
    use_when:
      - Log/git analysis, file listing, grep/glob searches
      - Doctor checks, tech-digest source fetching
      - Onboard structure scans, stats collection
      - Any task where the answer is in the output, not in reasoning

  worker:
    model: sonnet
    effort: medium
    tools: [Read, Edit, Write, Grep, Glob, Bash, WebFetch, WebSearch]
    description: Standard implementation, review, debugging
    prompt_prefix: null
    use_when:
      - Code changes, KB updates, refactoring
      - PR review analysis, comment drafting
      - Debugging, test writing
      - Skill execution requiring multi-step judgment

  verifier:
    # nase-verifier (.claude/agents/nase-verifier.md, tools Read, Grep, Glob) is the enforced read-only agent; Bash here is not.
    model: sonnet
    effort: medium
    tools: [Read, Grep, Glob, Bash]
    description: Read-only reasoning pass for spec-vs-artifact or review-thread verification
    prompt_prefix: "This is an independent read-only verification pass. Do not edit files. Report outcomes faithfully: state a failed check as failed with the evidence, name any step you skipped, and do not soften or celebrate incomplete work. A pass is stated plainly; uncertainty is stated as uncertainty."
    use_when:
      - Verifying a diff against a task spec
      - Verifying review-thread replies and resolution safety
      - Scoring a design artifact against explicit criteria
      - Any judgment-heavy check that must be read-only

  checker:
    model: haiku
    effort: medium
    tools: [Read, Grep, Glob, Bash]
    description: Read-only item-by-item check where every answer is one value from a fixed list
    prompt_prefix: "This is an independent read-only verification pass. Do not edit files. Report outcomes faithfully: state a failed check as failed with the evidence, name any step you skipped, and do not soften or celebrate incomplete work. A pass is stated plainly; uncertainty is stated as uncertainty."
    use_when:
      - Checking each prior bot comment against the PR's current head (the /nase:discuss-pr batch-verify, the only checker site)

  architect:
    model: opus
    effort: high
    tools: ["*"]                       # unrestricted - architectural work may need anything
    description: Deep analysis, architecture, security, unfamiliar codebases
    prompt_prefix: null
    use_when:
      - Unfamiliar codebase deep exploration
      - Security review, threat modeling
      - Design decisions, architecture trade-offs
      - Complex cross-repo analysis

# Where named skill phases actually dispatch. A spawn that names no role inherits the
# session model, so on an Opus session every unrouted fan-out bills at Opus for work
# that does not need it. Name a role at every spawn site.
#
#   Skill              Phase / work                                  Role
#   ----------------   -------------------------------------------   --------
#   design             KB + repo + workspace context scans           (persisted haiku agents)
#   design             auto Step 4a scoring the draft                verifier
#   design             grill branch resolution (codebase/config)     lookup
#   design             architecture trade-off with no local          architect  (reserved: no live spawn site yet;
#                      precedent, cross-repo or security-shaped     see design.md Step 4 for activation rule)
#   discuss-pr         PR metadata / changed files                   (nase-pr-metadata-reader, haiku)
#   discuss-pr         Step 5b code traces                           trace-role.py resolve (worker by default)
#   discuss-pr         Step 6.5 code traces                          worker
#   discuss-pr         Step 5.7 doubt pass                           verifier
#   discuss-pr         bot-comment batch-verify                      checker
#   address-comments   Phase 2 dossier collection                    verifier
#   address-comments   Phase 7.5 resolution gate                     verifier
#   fsd                Phase 6.4 candidate review                    verifier
#   fsd                phase-isolation subagents                     worker
#                      (fsd-phase-decomposition.md Step 5)
#   fsd                parallel PR wave agents                       worker
#                      (fsd-parallel-prs.md Fan out)
#   wrap-up            log / stats / effort scans                    (nase-workspace-state-scanner, haiku)
#   simplify           Step 5-6 anti-slop pass                       (code-simplifier plugin agent)
#   tech-debt-audit    Step 7 tech-debt-review sanity pass           verifier
#   today              Step 7 todo-review item re-checks             verifier
#   kb-review          broad review, disjoint KB domains             (nase-context-kb-researcher, haiku)
#   stats              Steps 1-3 sweep over a range above 14 days    lookup
#   skill-audit        per-file verdict batches when target is all   verifier
#   terminology        local repo grep for a term                    lookup
#   learn              fetch-and-extract sweep over 3+ sources       worker
#   onboard            per-repo structure survey, up to 4 at a time  (nase-repo-state-scanner)
#   recap              broad range, disjoint date slices             (nase-workspace-state-scanner)
#
# Ad hoc work is the larger share of sweeping: most repo reading in this workspace
# happens in the main loop with no skill named at all. The routing rule in CLAUDE.md
# covers that case; this table only records where the named phases dispatch.
#
# architect is the only opus role. design.md names it for one case, a cross-repo or
# security-shaped architecture call with no local precedent, and no run has used it. Reaching
# for it needs a reason a verifier pass cannot cover. "This feels important" is not one.
#
# Routing rules:
#   default: worker
#   For lookup dispatches: always include prompt_prefix in the agent prompt.
#   When a workflow needs read-only judgment, prefer verifier over worker.
#   checker is for one named spawn site only. Every gate that must not be skipped stays
#   on verifier, and a new checker site needs its own eval first.
#   When uncertain between lookup and worker: prefer worker. Between worker and
#   architect: prefer worker unless the task is security, architecture, or an unfamiliar codebase.
#
# Effort scaling (size reasoning to the task, not just the role):
#   Start from the role's `effort:`, then adjust by one tier on the low|medium|high
#   ladder before spawning. Do NOT change the model - effort and model move independently.
#     - trivial / mechanical / answer-is-in-the-output  -> drop one tier (floor: low)
#     - complex / ambiguous / multi-constraint / first attempt at a hard problem
#                                                       -> raise one tier (cap: high)
#     - re-running a check that just failed (verifier, checker, or a worker retry)
#                                                       -> raise one tier for the re-run
#                                                          (cap: high), and stop at the first
#                                                          tier that settles it
#   The failure re-run is upward only, so it needs no eval gate: it spends more tokens
#   and cannot make a result worse. Do not use it to justify a lower first attempt.
#   Manual-only: never wire an automated effort/model downgrade without a quality eval gate
#   proving the routing is correct (a cheaper misroute is silently wrong).
#
# Tool whitelist enforcement:
#   The only enforced whitelist is a persisted agent's `tools:` frontmatter in
#   `.claude/agents/*.md`. The `tools:` lists above are advisory, because this Claude Code
#   build's Agent tool has no `tools` parameter. lookup, verifier, and checker are read-only
#   by their prompt_prefix, not by enforcement. A step that needs enforced read-only runs
#   through a persisted agent. Those are `Read, Grep, Glob` with no Bash
#   (`tests/scripts/test-workspace-skill-p1-fixes.sh` asserts it), so a spawn site that needs
#   `gh`, `git log`, or any shell probe runs it in the main thread and pastes the result into
#   the agent's prompt. Never widen an agent to close that gap.
#
# Model pins:
#   Sonnet 5 is the Claude Code default, but the roles pin models explicitly. Do not promote
#   Sonnet 5 to architect/verifier without a quality eval.
#   The `haiku` alias resolves to Haiku 5.5 on the Anthropic API and to Haiku 4.5 on Bedrock,
#   Vertex, and Foundry, so pin `claude-haiku-5-5` or set ANTHROPIC_DEFAULT_HAIKU_MODEL there.
#   checker rests on one A/B. Sonnet 5.5 and Haiku 5.5 gave the same state on 29 of 29 claims
#   from one PR. Haiku never answered CONFIRMED on a false claim. Spend was not measured and
#   the sample is one PR. Do not extend checker to a gate on this evidence.
