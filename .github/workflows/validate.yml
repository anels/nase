name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same ref makes the older run pointless, so cancel it instead
# of queueing it behind the current one.
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Runs before any later step writes into the checkout. History is not scanned: the
      # gate guards the tree a change leaves behind. To locate a finding, run the same
      # command locally with --verbose.
      - name: Credential scan
        env:
          GITLEAKS_VERSION: 8.30.1
          # The linux_x64 line of the release's gitleaks_8.30.1_checksums.txt.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/${asset}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/${asset}" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/${asset}" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --no-git --redact --no-banner --config .gitleaks.toml

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 jq ripgrep p7zip-full zip unzip
          # Pinned release binary with checksum verification against the release's
          # actionlint_${ACTIONLINT_VERSION}_checksums.txt: no Go toolchain, no compile.
          ACTIONLINT_VERSION=1.7.12
          asset="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/${asset}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${asset}"
          curl -fsSL -o "$RUNNER_TEMP/actionlint-checksums.txt" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP" && grep " ${asset}$" actionlint-checksums.txt | sha256sum -c -)
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/${asset}" -C "$HOME/.local/bin" actionlint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # Pinned so a new ruff release cannot turn a green PR red on its own.
          # tests/check-all.sh skips this gate locally when ruff is absent, so CI
          # is the only place it is guaranteed to run.
          pipx install ruff==0.17.5
          # The gate skips silently when ruff is off PATH, so CI would stay green
          # with the lint never run. Prove the install landed somewhere callable.
          ruff --version
          pipx install vermin==1.9.2
          vermin --version
          # Pinned for the same reason as ruff: the apt package floats with the runner
          # image, so a new shellcheck release could change which warnings fail the gate.
          # The PyPI package 0.11.0.1 bundles the 0.11.0 binary.
          pipx install shellcheck-py==0.11.0.1
          shellcheck --version

      - name: Verify runtime prerequisites
        # Tests that need zip or a headless Chrome skip or degrade when it is missing,
        # which would leave CI green without ever running them. Fail the job instead.
        run: |
          command -v zip >/dev/null || { echo "::error::zip is not installed"; exit 1; }
          command -v google-chrome >/dev/null || command -v chromium >/dev/null \
            || { echo "::error::no headless Chrome (google-chrome or chromium) on PATH"; exit 1; }

      - name: Boundary terms
        env:
          NASE_BOUNDARY_TERMS: ${{ secrets.NASE_BOUNDARY_TERMS }}
        run: |
          if [ -n "$NASE_BOUNDARY_TERMS" ]; then
            umask 077
            printf '%s\n' "$NASE_BOUNDARY_TERMS" > "$RUNNER_TEMP/boundary-terms.txt"
            echo "NASE_BOUNDARY_TERMS_FILE=$RUNNER_TEMP/boundary-terms.txt" >> "$GITHUB_ENV"
          else
            echo "::warning::boundary-terms gate not enforced: secret NASE_BOUNDARY_TERMS is absent (fork PR or unset)"
          fi

      - name: Full local validation gate
        run: bash tests/check-all.sh

      - name: Markdown internal-link check
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2
        with:
          # Pin lychee binary so flag compatibility (notably --include-fragments)
          # is reproducible across runs. Action prepends `lychee-` to this value
          # when constructing the release URL - provide bare `vX.Y.Z`.
          lycheeVersion: v0.15.1
          # tests/fixtures is excluded because fixtures are deliberately malformed
          # inputs, not documentation: confluence-publish/digest.md carries a broken
          # image reference on purpose, since that is what proves `plan` warns that
          # markdown passthrough cannot carry a local image.
          args: >-
            --offline
            --no-progress
            --include-fragments
            --exclude-path workspace
            --exclude-path .omc
            --exclude-path node_modules
            --exclude-path tests/fixtures
            './**/*.md'
            '.claude/**/*.md'
          fail: true

  validate-windows:
    # Runs the test files that pass on native Windows under Git Bash. Files listed in
    # tests/windows-known-failures.txt are skipped with a count.
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      # The runner's default autocrlf=true checks files out with CRLF, which adds a byte per
      # line and pushes the command size budget over its limit. Set it before checkout.
      - name: Check out with LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # check-local-sensitive-artifacts.sh and several skill tests require ripgrep.
      - name: Install ripgrep
        run: choco install ripgrep --yes --no-progress

      - name: Verify runtime prerequisites
        run: |
          command -v python3 >/dev/null || { echo "::error::python3 is not on PATH"; exit 1; }
          python3 --version
          command -v jq >/dev/null || { echo "::error::jq is not on PATH"; exit 1; }
          command -v git >/dev/null || { echo "::error::git is not on PATH"; exit 1; }
          command -v rg >/dev/null || { echo "::error::rg is not on PATH"; exit 1; }

      - name: Full local validation gate
        run: bash tests/check-all.sh
