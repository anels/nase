name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 jq ripgrep p7zip-full zip unzip
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          # Pinned so a new ruff release cannot turn a green PR red on its own.
          # tests/check-all.sh skips this gate locally when ruff is absent, so CI
          # is the only place it is guaranteed to run.
          pipx install ruff==0.17.5
          # The gate skips silently when ruff is off PATH, so CI would stay green
          # with the lint never run. Prove the install landed somewhere callable.
          ruff --version
          pipx install vermin==1.9.2
          vermin --version
          # Pinned for the same reason as ruff: the apt package floats with the runner
          # image, so a new shellcheck release could change which warnings fail the gate.
          # The PyPI package 0.11.0.1 bundles the 0.11.0 binary.
          pipx install shellcheck-py==0.11.0.1
          shellcheck --version

      - name: Verify runtime prerequisites
        # Tests that need zip or a headless Chrome skip or degrade when it is missing,
        # which would leave CI green without ever running them. Fail the job instead.
        run: |
          command -v zip >/dev/null || { echo "::error::zip is not installed"; exit 1; }
          command -v google-chrome >/dev/null || command -v chromium >/dev/null \
            || { echo "::error::no headless Chrome (google-chrome or chromium) on PATH"; exit 1; }

      - name: Boundary terms
        env:
          NASE_BOUNDARY_TERMS: ${{ secrets.NASE_BOUNDARY_TERMS }}
        run: |
          if [ -n "$NASE_BOUNDARY_TERMS" ]; then
            umask 077
            printf '%s\n' "$NASE_BOUNDARY_TERMS" > "$RUNNER_TEMP/boundary-terms.txt"
            echo "NASE_BOUNDARY_TERMS_FILE=$RUNNER_TEMP/boundary-terms.txt" >> "$GITHUB_ENV"
          else
            echo "::warning::boundary-terms gate not enforced: secret NASE_BOUNDARY_TERMS is absent (fork PR or unset)"
          fi

      - name: Full local validation gate
        run: bash tests/check-all.sh

      - name: Markdown internal-link check
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2
        with:
          # Pin lychee binary so flag compatibility (notably --include-fragments)
          # is reproducible across runs. Action prepends `lychee-` to this value
          # when constructing the release URL - provide bare `vX.Y.Z`.
          lycheeVersion: v0.15.1
          # tests/fixtures is excluded because fixtures are deliberately malformed
          # inputs, not documentation: confluence-publish/digest.md carries a broken
          # image reference on purpose, since that is what proves `plan` warns that
          # markdown passthrough cannot carry a local image.
          args: >-
            --offline
            --no-progress
            --include-fragments
            --exclude-path workspace
            --exclude-path .omc
            --exclude-path node_modules
            --exclude-path tests/fixtures
            './**/*.md'
            '.claude/**/*.md'
          fail: true
